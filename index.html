<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Flash - Media Downloader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    ⚡
                </div>
                <div>
                    <h1 class="text-xl font-bold text-cyan-400">Fast Flash</h1>
                    <p class="text-xs text-slate-400">Media Downloader Pro</p>
                </div>
            </div>
            <button onclick="alert('تم تسجيل الدخول بنجاح!')" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md">
                تسجيل الدخول بـ Gmail
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto px-4 py-12 w-full space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-slate-200">حمل فيديوهاتك وصورك بضغطة واحدة</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-300 mb-2">ضع رابط الفيديو أو الصورة هنا:</label>
                    <input type="url" id="mediaUrl" placeholder="https://example.com/video..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">نوع المحتوى:</label>
                        <select id="mediaType" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200">
                            <option value="both">الكل (فيديو وصورة)</option>
                            <option value="video">فيديو فقط</option>
                            <option value="image">صورة فقط</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">الجودة:</label>
                        <select id="mediaQuality" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200">
                            <option value="1080p">1080p (Full HD)</option>
                            <option value="720p">720p (HD)</option>
                            <option value="mp3">صوت فقط (MP3)</option>
                        </select>
                    </div>
                </div>

                <button onclick="startDownload()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-500/20">
                    بدء التحميل الآن 🚀
                </button>
            </div>

            <div id="resultBox" class="mt-6 hidden p-4 bg-slate-950 border border-emerald-500/30 rounded-xl text-center">
                <p class="text-emerald-400 text-sm font-semibold">✨ تم معالجة الرابط وجاهز للتنزيل!</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-600 border-t border-slate-900">
        © Fast Flash Media Downloader - جميع الحقوق محفوظة
    </footer>

    <script>
        function startDownload() {
            const url = document.getElementById('mediaUrl').value;
            if(!url) {
                alert('الرجاء إدخال رابط صحيح أولاً!');
                return;
            }
            const resultBox = document.getElementById('resultBox');
            resultBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
