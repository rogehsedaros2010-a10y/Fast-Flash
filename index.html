<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Flash - Media Downloader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 text-xl font-bold text-white">
                    ⚡
                </div>
                <div>
                    <h1 class="text-xl font-bold text-cyan-400">Fast Flash</h1>
                    <p class="text-xs text-slate-400">Media Downloader Pro</p>
                </div>
            </div>
            <button onclick="handleLogin()" id="loginBtn" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md hover:opacity-90 transition">
                تسجيل الدخول بـ Gmail
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto px-4 py-10 w-full space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            <h2 class="text-lg font-bold mb-4 text-slate-200">حمل فيديوهاتك وصورك بضغطة واحدة</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-300 mb-2">ضع رابط الفيديو أو الصورة هنا:</label>
                    <input type="url" id="mediaUrl" placeholder="ضع رابط الفيديو أو الصورة هنا..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">نوع المحتوى:</label>
                        <select id="mediaType" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="both">الكل (فيديو وصورة)</option>
                            <option value="video">فيديو فقط</option>
                            <option value="image">صورة فقط</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">الجودة المطلوب تنزيلها:</label>
                        <select id="mediaQuality" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="1080p">1080p (Full HD)</option>
                            <option value="720p">720p (HD)</option>
                            <option value="mp3">صوت فقط (MP3)</option>
                        </select>
                    </div>
                </div>

                <button onclick="startProcessing()" id="downloadBtn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2">
                    <span>عرض واستخراج الملف 🚀</span>
                </button>
            </div>

            <!-- Loading Bar -->
            <div id="loadingBox" class="mt-6 hidden space-y-2">
                <div class="flex justify-between text-xs text-slate-400">
                    <span>جاري تجهيز مشغل الفيديوهات ورابط التحميل...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-300 w-0"></div>
                </div>
            </div>

            <!-- Result Media Section -->
            <div id="resultBox" class="mt-6 hidden bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1">
                        ✨ تم معالجة المحتوى بنجاح
                    </span>
                    <span id="qualityBadge" class="bg-cyan-500/10 text-cyan-400 text-[10px] px-2 py-1 rounded-md border border-cyan-500/20">
                        1080p
                    </span>
                </div>

                <!-- Embedded Preview Container -->
                <div id="mediaContainer" class="w-full rounded-lg overflow-hidden bg-black flex justify-center items-center min-h-[200px]">
                    <!-- سيتم إدراج مشغل الفيديو أو الصورة هنا تلقائياً -->
                </div>

                <!-- Download Actions -->
                <div class="pt-2 flex flex-col sm:flex-row gap-3">
                    <button onclick="downloadMediaDirectly()" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-90 text-white font-bold py-3 rounded-xl text-sm shadow-md transition flex justify-center items-center gap-2">
                        <span>⬇️ تنزيل الملف مباشرة على الجهاز</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-600 border-t border-slate-900">
        © Fast Flash Media Downloader - جميع الحقوق محفوظة
    </footer>

    <script>
        let currentMediaUrl = '';

        function handleLogin() {
            const btn = document.getElementById('loginBtn');
            btn.innerText = 'مرحباً بك (مستخدم Fast Flash)';
            btn.classList.remove('from-cyan-500', 'to-blue-600');
            btn.classList.add('bg-emerald-600');
        }

        function startProcessing() {
            currentMediaUrl = document.getElementById('mediaUrl').value.trim();
            if (!currentMediaUrl) {
                alert('الرجاء إدخال رابط صحيحي أولاً!');
                return;
            }

            const loadingBox = document.getElementById('loadingBox');
            const resultBox = document.getElementById('resultBox');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const mediaContainer = document.getElementById('mediaContainer');
            const qualitySelected = document.getElementById('mediaQuality').value;

            document.getElementById('qualityBadge').innerText = qualitySelected;
            resultBox.classList.add('hidden');
            loadingBox.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressText.innerText = '0%';

            let progress = 0;
            const interval = setInterval(() => {
                progress += 25;
                progressBar.style.width = progress + '%';
                progressText.innerText = progress + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    loadingBox.classList.add('hidden');
                    
                    // تجهيز المشغل المعاين
                    if (currentMediaUrl.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                        mediaContainer.innerHTML = `<img src="${currentMediaUrl}" class="max-h-72 object-contain rounded-lg" alt="Preview"/>`;
                    } else {
                        mediaContainer.innerHTML = `
                            <video controls class="w-full max-h-72 rounded-lg">
                                <source src="${currentMediaUrl}" type="video/mp4">
                                المتصفح لا يدعم تشغيل هذا الفيديو مباشرة.
                            </video>`;
                    }

                    resultBox.classList.remove('hidden');
                }
            }, 200);
        }

        // إجبار المتصفح على حفظ الملف فوراً
        async function downloadMediaDirectly() {
            try {
                const response = await fetch(currentMediaUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `FastFlash_${Date.now()}.mp4`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);
            } catch (err) {
                // حل بديل في حال قيود الحماية الخارجية (Force Save)
                const link = document.createElement('a');
                link.href = currentMediaUrl;
                link.setAttribute('download', 'FastFlash_Media.mp4');
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
